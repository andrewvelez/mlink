<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <title>Home</title>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181818">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="./icons/icon_24.png" type="image/png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./external/pico.cyan.min.css">
    <script src="./external/htmx.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </head>

  <body>
    <header class="app-header">
      <a class="brand" href="./">Link-Up</a>
      <nav aria-label="Primary navigation">
        <a href="./home" aria-current="page">Home</a>
        <a href="./about">About</a>
      </nav>
    </header>

    <main id="app" tabindex="-1">
      <section class="page" aria-labelledby="welcome-heading">
        <div class="card">
          <h1 id="welcome-heading">Welcome to Link-Up</h1>
          <p>
            Link-Up is a local-first Progressive Web App built with vanilla
            JavaScript and standard browser APIs.
          </p>
          <button id="share-button" type="button" hidden>Share Link-Up</button>
        </div>
        <div class="card">
          <h2>Technology</h2>
          <ul>
            <li>HTML and CSS</li>
            <li>Vanilla JavaScript</li>
            <li>Progressive Web App APIs</li>
            <li>Bun bundling</li>
          </ul>
        </div>
      </section>
    </main>
  </body>

</html>
